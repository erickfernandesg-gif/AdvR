name: Supabase keep alive

on:
  schedule:
    # Daily at 12:17 UTC. Any daily time is sufficient; GitHub Actions uses UTC.
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the safe Supabase heartbeat RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          curl --fail --silent --show-error --max-time 20 \
            --request POST "$SUPABASE_URL/rest/v1/rpc/keep_alive" \
            --header "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            --header "Content-Type: application/json" \
            --data '{}'
